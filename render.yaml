services:
  - type: web
    name: propvox-voice-agent
    runtime: docker
    # free: WebSockets work, but the service sleeps after ~15 min idle and takes ~1 min to wake; the demo page
    # starts waking it on page load. starter (~$7/month) is always on: change the plan here or in the dashboard.
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 5050
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      # Secrets: set these in the Render dashboard (sync: false keeps them out of this file).
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Browser demo (web/index.html at "/"): off unless an access code is set.
      # Share the link as https://<service>.onrender.com/?code=<WEB_DEMO_CODE>
      - key: WEB_DEMO_CODE
        sync: false
      # Only this page may check codes or start calls (the Vercel site).
      - key: WEB_DEMO_ALLOWED_ORIGINS
        value: https://propvox.vercel.app
      - key: WEB_DEMO_MAX_SECONDS
        value: "180"
      - key: WEB_DEMO_MAX_CONCURRENT
        value: "2"
      - key: WEB_DEMO_MAX_PER_DAY
        value: "40"
